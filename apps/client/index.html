    <noscript>
      <main style="max-width: 42rem; margin: 3rem auto; padding: 0 1.25rem; font: 16px/1.55 system-ui, sans-serif; color: #0f172a">
        <h1>Freight Floor: a multiplayer forklift game</h1>
        <p>Freight Floor is a free, arcade-style multiplayer forklift game that runs in your browser. You drive a forklift on a shared warehouse floor: grab rush pallets off the receiving dock, weave through the aisles past rival forklifts, and deliver to the right bay before the clock runs out.</p>
        <h2>How it plays</h2>
        <ul>
          <li><strong>3-Minute Blitz:</strong> a personal high-score run. The clock starts when you first drive.</li>
          <li><strong>Free Range:</strong> open-ended driving, ranked by points per minute and on-time rate.</li>
          <li><strong>AI rivals:</strong> the other forklifts are AI drivers whose decisions come from Google Gemini.</li>
          <li><strong>Contract cards:</strong> pick goals at the start of each run. Finished cards give perks such as more speed or reach.</li>
          <li><strong>Four regional sites:</strong> Denver, Salt Lake City, Phoenix and Albuquerque, with pallets moving between them.</li>
          <li><strong>Controls:</strong> WASD to drive, E to pick up or drop, Shift to boost, C for Co-Pilot.</li>
        </ul>
        <p><strong>Freight Floor needs JavaScript to play.</strong> Turn on JavaScript and reload this page.</p>
        <p>
          <a href="https://github.com/davenportjw/freightfloor">Source code on GitHub</a> (Apache-2.0) ·
