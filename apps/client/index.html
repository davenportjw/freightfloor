<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Warehouse — Live Floor</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <!-- Full-bleed world canvas. The renderer sizes it from this container. -->
    <div id="stage">
      <canvas id="world" aria-label="Warehouse floor. Drag to pan, scroll to zoom, click a vehicle to inspect it."></canvas>
    </div>

    <!-- HUD zones: modules in src/ui/ mount into these. Tab hides all of them. -->
    <div id="zoneLeft" class="zone zone-left"></div>
    <div id="zoneInspector" class="zone zone-inspector"></div>
    <div id="zoneRight" class="zone zone-right"></div>
    <div id="a2uiZone" class="zone zone-a2ui"></div>
    <div id="zoneBottom" class="zone zone-bottom"></div>
    <div id="zoneCorner" class="zone zone-corner">
      <div id="toasts" class="toasts" aria-live="polite"></div>
      <div id="cardsTray"></div>
    </div>

    <div id="hudHiddenHint" class="hud hud-hidden-hint" hidden>Panels hidden · press <span class="kbd">Tab</span> to show</div>

    <aside id="drawer" class="hud drawer closed" aria-label="History drawer"></aside>

    <div id="help" class="overlay" hidden></div>
    <div id="leaderboardModal" class="overlay" hidden></div>
    <div id="agent-designer-modal" class="overlay" hidden></div>
    <div id="runEnd" class="overlay" hidden></div>

    <!-- Shown only when no display name is saved yet; nothing connects until a name is chosen. -->
    <div id="joinOverlay" class="overlay" hidden>
      <form id="joinForm" class="hud join-card" aria-labelledby="joinTitle">
        <h2 id="joinTitle">Join the warehouse</h2>
        <p class="muted">Pick a display name. Other players see it on the leaderboard.</p>
        <label class="label" for="joinName">Display name</label>
        <input id="joinName" class="text-input" maxlength="18" autocomplete="nickname" required />
        <div id="joinError" class="form-error" role="alert"></div>
        <button class="btn drive" type="submit">Join</button>
      </form>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
