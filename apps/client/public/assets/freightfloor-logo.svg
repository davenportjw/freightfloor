<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 176" width="820" height="176" role="img" aria-label="Freight Floor — Grab pallets. Thread the aisles. Beat the 3-minute clock.">
  <defs>
    <linearGradient id="tileTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="amberTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="amberLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="amberRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.11" />
    </filter>
  </defs>

  <!-- Soft Ambient Glow Under Forklift Plinth -->
  <ellipse cx="148" cy="124" rx="84" ry="30" fill="#f59e0b" opacity="0.10" />
  <ellipse cx="148" cy="124" rx="52" ry="18" fill="#3b82f6" opacity="0.08" />

  <!-- ================= ISOMETRIC 2:1 FORKLIFT & PALLET EMBLEM ================= -->
  <g transform="translate(148, 96)" filter="url(#softShadow)">
    <!-- Warehouse Concrete Floor Plinth (Isometric Diamond 2:1, matching light warehouse floor) -->
    <polygon points="0,-58 104,-6 0,46 -104,-6" fill="url(#tileTop)" stroke="#cbd5e1" stroke-width="1.5" />
    <polygon points="-104,-6 0,46 0,57 -104,5" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1" />
    <polygon points="104,-6 0,46 0,57 104,5" fill="#94a3b8" stroke="#64748b" stroke-width="1" />

    <!-- Floor Sub-Grid & Bay Striping -->
    <line x1="-52" y1="-32" x2="52" y2="20" stroke="#cbd5e1" stroke-width="1.2" />
    <line x1="-52" y1="20" x2="52" y2="-32" stroke="#cbd5e1" stroke-width="1.2" />
    <polygon points="0,-50 88,-6 0,38 -88,-6" fill="none" stroke="#d97706" stroke-width="1.6" stroke-dasharray="8 5" opacity="0.75" />
    <polygon points="-72,-4 -36,14 -26,9 -62,-9" fill="#3b82f6" opacity="0.28" />

    <!-- Forklift -->
    <g transform="translate(-26, -12)">
      <polygon points="0,-10 42,11 10,27 -32,6" fill="#0f172a" opacity="0.18" />
      <polygon points="-8,-26 24,-10 2,1 -30,-15" fill="url(#amberTop)" />
      <polygon points="-30,-15 2,1 2,18 -30,2" fill="url(#amberLeft)" />
      <polygon points="2,1 24,-10 24,7 2,18" fill="url(#amberRight)" />
      <polygon points="-30,-3 2,13 2,18 -30,2" fill="#1e293b" />
      <polygon points="2,13 24,2 24,7 2,18" fill="#0f172a" />
      <polygon points="-24,-10 -6,-1 -6,3 -24,-6" fill="#2563eb" />

      <!-- Wheels -->
      <ellipse cx="-22" cy="7" rx="5.5" ry="5.5" fill="#0f172a" stroke="#475569" stroke-width="2" />
      <circle cx="-22" cy="7" r="2" fill="#cbd5e1" />
      <ellipse cx="-3" cy="16" rx="5.5" ry="5.5" fill="#0f172a" stroke="#475569" stroke-width="2" />
      <circle cx="-3" cy="16" r="2" fill="#cbd5e1" />

      <!-- Seat & ROPS Cab -->
      <polygon points="-14,-28 -2,-22 -8,-19 -20,-25" fill="#1e293b" />
      <path d="M-24,-16 L-22,-42 L-2,-32 L-4,-6" fill="none" stroke="#334155" stroke-width="2.8" stroke-linejoin="round" />
      <path d="M-4,-6 L16,-16 L14,-42 L-2,-32" fill="none" stroke="#1e293b" stroke-width="2.8" stroke-linejoin="round" />
      <polygon points="-8,-48 16,-36 -2,-27 -26,-39" fill="#334155" stroke="#475569" stroke-width="1" />
      <circle cx="-5" cy="-38" r="3.5" fill="#fbbf24" />
      <circle cx="-5" cy="-38" r="6" fill="#f59e0b" opacity="0.35" />

      <!-- Mast & Forks -->
      <line x1="18" y1="-44" x2="18" y2="10" stroke="#475569" stroke-width="3.5" stroke-linecap="round" />
      <line x1="8" y1="-39" x2="8" y2="15" stroke="#64748b" stroke-width="3.5" stroke-linecap="round" />
      <line x1="8" y1="-26" x2="18" y2="-31" stroke="#334155" stroke-width="2.5" />
      <line x1="8" y1="-10" x2="18" y2="-15" stroke="#334155" stroke-width="2.5" />
      <polygon points="8,4 38,19 42,17 12,2" fill="#64748b" />
      <polygon points="18,-1 48,14 52,12 22,-3" fill="#94a3b8" />
    </g>

    <!-- Pallet & Freight Carton -->
    <g transform="translate(18, -2)">
      <polygon points="0,-12 30,3 6,15 -24,0" fill="#d99b52" />
      <polygon points="-24,0 6,15 6,20 -24,5" fill="#b07530" />
      <polygon points="6,15 30,3 30,8 6,20" fill="#85541a" />
      <polygon points="10,15 16,12 16,15 10,18" fill="#1e293b" />
      <polygon points="20,10 26,7 26,10 20,13" fill="#1e293b" />

      <polygon points="0,-34 26,-21 4,-10 -22,-23" fill="#eab308" />
      <polygon points="-22,-23 4,-10 4,12 -22,-1" fill="#ca8a04" />
      <polygon points="4,-10 26,-21 26,1 4,12" fill="#a16207" />
      <polygon points="-13,-28 13,-15 10,-13 -16,-26" fill="#fef08a" opacity="0.85" />
      <polygon points="-16,-14 -2,-7 -2,1 -16,-6" fill="#ef4444" />
      <polygon points="10,-7 21,-12 21,-5 10,0" fill="#ffffff" opacity="0.92" />
    </g>
  </g>

  <!-- ================= GAME LOGO WORDMARK & HOOK ================= -->
  <g transform="translate(278, 0)">
    <!-- Main Title -->
    <text x="0" y="96" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="62" font-weight="900" letter-spacing="-1.5" fill="#0f172a">
      FREIGHT <tspan fill="url(#amberTop)">FLOOR</tspan>
    </text>

    <!-- Player Hook -->
    <text x="3" y="132" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18.5" font-weight="600" fill="#475569">
      Grab pallets. Thread the aisles. Beat the 3-minute clock.
    </text>
  </g>
</svg>
